# Mantiene activo el proyecto de Supabase (plan gratuito).
# Supabase pausa los proyectos gratuitos tras 7 días sin actividad; este workflow
# hace una consulta real a la base de datos dos veces por semana para evitarlo.
#
# Requiere dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       → https://TU-PROYECTO.supabase.co
#   SUPABASE_ANON_KEY  → la clave pública "anon" (la misma de VITE_SUPABASE_ANON_KEY)
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 13 * * 1,4'   # lunes y jueves, 08:00 hora de Perú (13:00 UTC)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY"
            exit 1
          fi
          # Consulta real a Postgres vía la API REST. Con RLS para usuarios autenticados
          # devuelve una lista vacía, pero la consulta se ejecuta y cuenta como actividad.
          for intento in 1 2 3; do
            code=$(curl -s -o respuesta.json -w "%{http_code}" \
              "${SUPABASE_URL%/}/rest/v1/settings?select=*&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Intento $intento → HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Supabase activo ✔"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase no respondió correctamente (HTTP $code)"
          cat respuesta.json || true
          exit 1
