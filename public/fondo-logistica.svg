<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 140 1920 940" preserveAspectRatio="xMidYMid slice">
  <!-- Patio logístico de noche: almacén con andenes, calles y camiones -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset=".45" stop-color="#071a3a"/>
      <stop offset=".62" stop-color="#11386a"/>
      <stop offset=".7" stop-color="#1d5590"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".5" cy=".62" r=".55">
      <stop offset="0" stop-color="#4f9bff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#2a6bc4" stop-opacity=".15"/>
      <stop offset="1" stop-color="#2a6bc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2347"/>
      <stop offset="1" stop-color="#030c1e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132f57"/>
      <stop offset="1" stop-color="#060f22"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173b6b"/>
      <stop offset="1" stop-color="#0b2142"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6ff"/>
      <stop offset=".35" stop-color="#7fb6f5"/>
      <stop offset="1" stop-color="#2d6bb3"/>
    </linearGradient>
    <linearGradient id="trailer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe9f6"/>
      <stop offset=".55" stop-color="#a9bfdb"/>
      <stop offset="1" stop-color="#6d88ad"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86d6"/>
      <stop offset="1" stop-color="#173f73"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="1" stop-color="#1b4778"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffd98a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueLamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e6f3ff" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#7fbcff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7fbcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff5a5a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#eaf4ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>

    <!-- Camión de costado mirando a la derecha: 0..400 de largo, 0..150 de alto -->
    <g id="truck">
      <rect x="0" y="0" width="296" height="112" rx="4" fill="url(#trailer)"/>
      <rect x="0" y="0" width="296" height="8" fill="#ffffff" opacity=".5"/>
      <g stroke="#7f98bb" stroke-width="1.5" opacity=".6">
        <line x1="47" y1="10" x2="47" y2="108"/><line x1="94" y1="10" x2="94" y2="108"/>
        <line x1="141" y1="10" x2="141" y2="108"/><line x1="188" y1="10" x2="188" y2="108"/>
        <line x1="235" y1="10" x2="235" y2="108"/>
      </g>
      <rect x="0" y="112" width="330" height="10" fill="#26364d"/>
      <rect x="288" y="104" width="22" height="14" fill="#1b2738"/>
      <path d="M302 30 h44 q14 0 22 14 l20 34 q6 10 6 22 v22 h-92 z" fill="url(#cab)"/>
      <path d="M318 40 h28 q8 0 12 8 l14 26 h-54 z" fill="url(#glass)"/>
      <rect x="302" y="96" width="92" height="6" fill="#0d2442" opacity=".6"/>
      <rect x="384" y="104" width="12" height="7" rx="2" fill="#fff6d0"/>
      <rect x="0" y="100" width="6" height="10" fill="#ff4a4a"/>
      <g fill="#0b1324">
        <circle cx="40" cy="128" r="17"/><circle cx="78" cy="128" r="17"/>
        <circle cx="236" cy="128" r="17"/><circle cx="330" cy="128" r="17"/><circle cx="372" cy="128" r="17"/>
      </g>
      <g fill="#5f7392">
        <circle cx="40" cy="128" r="6"/><circle cx="78" cy="128" r="6"/>
        <circle cx="236" cy="128" r="6"/><circle cx="330" cy="128" r="6"/><circle cx="372" cy="128" r="6"/>
      </g>
    </g>

    <!-- Camión visto de atrás, estacionado en un andén -->
    <g id="truckBack">
      <rect x="0" y="0" width="96" height="104" rx="3" fill="url(#trailer)"/>
      <line x1="48" y1="6" x2="48" y2="100" stroke="#6d88ad" stroke-width="2"/>
      <g stroke="#8aa3c4" stroke-width="1.4"><line x1="22" y1="8" x2="22" y2="98"/><line x1="74" y1="8" x2="74" y2="98"/></g>
      <rect x="-2" y="104" width="100" height="8" fill="#22324a"/>
      <rect x="4" y="106" width="10" height="5" fill="#ff4a4a"/><rect x="82" y="106" width="10" height="5" fill="#ff4a4a"/>
      <rect x="6" y="112" width="18" height="12" rx="3" fill="#0b1324"/><rect x="72" y="112" width="18" height="12" rx="3" fill="#0b1324"/>
    </g>

    <!-- Poste de luz -->
    <g id="pole">
      <rect x="-2" y="0" width="4" height="190" fill="#0a1a33"/>
      <path d="M0 4 q0 -12 26 -12 h10" stroke="#0a1a33" stroke-width="4" fill="none"/>
      <rect x="30" y="-12" width="18" height="6" rx="3" fill="#fff4cf"/>
      <circle cx="39" cy="-4" r="70" fill="url(#lamp)"/>
    </g>

    <!-- Árbol -->
    <g id="tree">
      <rect x="-4" y="40" width="8" height="70" fill="#041026"/>
      <ellipse cx="0" cy="30" rx="46" ry="52" fill="#06152f"/>
      <ellipse cx="-22" cy="52" rx="30" ry="32" fill="#051229"/>
      <ellipse cx="24" cy="50" rx="32" ry="34" fill="#071833"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect y="140" width="1920" height="940" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#horizon)"/>
  <g fill="#cfe2ff">
    <circle cx="120" cy="80" r="1.2" opacity=".7"/><circle cx="340" cy="150" r="1" opacity=".5"/><circle cx="520" cy="60" r="1.4" opacity=".8"/>
    <circle cx="760" cy="120" r="1" opacity=".5"/><circle cx="980" cy="40" r="1.3" opacity=".7"/><circle cx="1180" cy="140" r="1" opacity=".5"/>
    <circle cx="1400" cy="70" r="1.5" opacity=".8"/><circle cx="1620" cy="160" r="1" opacity=".5"/><circle cx="1820" cy="90" r="1.2" opacity=".7"/>
    <circle cx="250" cy="250" r="1" opacity=".4"/><circle cx="880" cy="230" r="1" opacity=".4"/><circle cx="1500" cy="260" r="1" opacity=".4"/>
    <circle cx="1720" cy="300" r="1.1" opacity=".5"/><circle cx="640" cy="310" r="1" opacity=".35"/>
  </g>

  <!-- Cerros lejanos -->
  <path d="M0 560 Q160 470 330 520 T680 500 T1010 470 T1350 505 T1680 470 T1920 520 V700 H0 Z" fill="#0a2246" opacity=".9"/>
  <path d="M0 600 Q220 540 420 585 T860 560 T1300 580 T1720 555 T1920 590 V700 H0 Z" fill="#0b2850"/>

  <!-- Árboles del fondo -->
  <g opacity=".95">
    <use href="#tree" x="70" y="520"/><use href="#tree" x="150" y="540" transform="scale(1)"/>
    <use href="#tree" x="1770" y="520"/><use href="#tree" x="1860" y="535"/>
    <use href="#tree" x="1680" y="548"/><use href="#tree" x="235" y="552"/>
  </g>

  <!-- Almacén principal -->
  <g>
    <rect x="300" y="420" width="1320" height="250" fill="url(#wall)"/>
    <polygon points="290,420 960,372 1630,420" fill="#0f2c55"/>
    <polyline points="290,420 960,372 1630,420" fill="none" stroke="#4f8fd8" stroke-width="2.5" opacity=".7"/>
    <rect x="300" y="420" width="1320" height="6" fill="#2e6ab0" opacity=".6"/>
    <!-- Ventanas altas -->
    <g fill="#7fb6f5" opacity=".55">
      <rect x="360" y="445" width="150" height="16" rx="2"/><rect x="560" y="445" width="150" height="16" rx="2"/>
      <rect x="760" y="445" width="150" height="16" rx="2"/><rect x="1010" y="445" width="150" height="16" rx="2"/>
      <rect x="1210" y="445" width="150" height="16" rx="2"/><rect x="1410" y="445" width="150" height="16" rx="2"/>
    </g>
    <!-- Letrero -->
    <rect x="860" y="478" width="200" height="30" rx="4" fill="#0a1d3b" stroke="#4f9bff" stroke-width="1.5"/>
    <text x="960" y="499" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9fd0ff" letter-spacing="3">CENTRO DE DISTRIBUCIÓN</text>
    <!-- Andenes iluminados -->
    <g>
      <g fill="url(#dock)">
        <rect x="340" y="540" width="84" height="110"/><rect x="460" y="540" width="84" height="110"/>
        <rect x="580" y="540" width="84" height="110"/><rect x="700" y="540" width="84" height="110"/>
        <rect x="1136" y="540" width="84" height="110"/><rect x="1256" y="540" width="84" height="110"/>
        <rect x="1376" y="540" width="84" height="110"/><rect x="1496" y="540" width="84" height="110"/>
      </g>
      <g fill="#0b2142" opacity=".5">
        <rect x="340" y="540" width="84" height="14"/><rect x="460" y="540" width="84" height="14"/>
        <rect x="580" y="540" width="84" height="14"/><rect x="700" y="540" width="84" height="14"/>
        <rect x="1136" y="540" width="84" height="14"/><rect x="1256" y="540" width="84" height="14"/>
        <rect x="1376" y="540" width="84" height="14"/><rect x="1496" y="540" width="84" height="14"/>
      </g>
      <g fill="url(#blueLamp)">
        <circle cx="382" cy="528" r="34"/><circle cx="502" cy="528" r="34"/><circle cx="622" cy="528" r="34"/><circle cx="742" cy="528" r="34"/>
        <circle cx="1178" cy="528" r="34"/><circle cx="1298" cy="528" r="34"/><circle cx="1418" cy="528" r="34"/><circle cx="1538" cy="528" r="34"/>
      </g>
      <!-- Número de andén -->
      <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfe6ff" text-anchor="middle">
        <text x="382" y="534">01</text><text x="502" y="534">02</text><text x="622" y="534">03</text><text x="742" y="534">04</text>
        <text x="1178" y="534">05</text><text x="1298" y="534">06</text><text x="1418" y="534">07</text><text x="1538" y="534">08</text>
      </g>
    </g>
    <!-- Portón central -->
    <rect x="850" y="530" width="220" height="140" fill="#0d2a52"/>
    <g stroke="#2a5c99" stroke-width="2" opacity=".8">
      <line x1="850" y1="550" x2="1070" y2="550"/><line x1="850" y1="570" x2="1070" y2="570"/><line x1="850" y1="590" x2="1070" y2="590"/>
      <line x1="850" y1="610" x2="1070" y2="610"/><line x1="850" y1="630" x2="1070" y2="630"/><line x1="850" y1="650" x2="1070" y2="650"/>
    </g>
  </g>

  <!-- Patio -->
  <rect x="0" y="668" width="1920" height="412" fill="url(#ground)"/>
  <rect x="300" y="666" width="1320" height="6" fill="#1f4e86" opacity=".7"/>

  <!-- Camiones estacionados en los andenes -->
  <g>
    <use href="#truckBack" x="334" y="592"/><use href="#truckBack" x="574" y="592"/>
    <use href="#truckBack" x="694" y="592"/><use href="#truckBack" x="1250" y="592"/>
    <use href="#truckBack" x="1490" y="592"/>
  </g>

  <!-- Calle principal en perspectiva -->
  <polygon points="860,700 1060,700 1920,1080 0,1080" fill="url(#road)"/>
  <polygon points="0,760 1920,760 1920,800 0,800" fill="#0d2546" opacity=".9"/>
  <g stroke="#e7d27a" stroke-width="3" opacity=".75">
    <line x1="958" y1="705" x2="954" y2="725"/><line x1="951" y1="745" x2="946" y2="775"/>
    <line x1="942" y1="805" x2="935" y2="850"/><line x1="928" y1="890" x2="918" y2="955"/><line x1="908" y1="1000" x2="896" y2="1080"/>
  </g>
  <g stroke="#e8eef8" stroke-width="2.5" opacity=".55">
    <line x1="870" y1="705" x2="0" y2="1078"/><line x1="1050" y1="705" x2="1920" y2="1078"/>
  </g>
  <!-- Calle transversal -->
  <g stroke="#e8eef8" stroke-width="2" opacity=".35" stroke-dasharray="40 30">
    <line x1="0" y1="780" x2="1920" y2="780"/>
  </g>

  <!-- Estelas de luces de autos -->
  <g filter="url(#blur2)">
    <rect x="80" y="768" width="620" height="3" fill="url(#trailRed)"/>
    <rect x="1220" y="790" width="640" height="3" fill="url(#trailWhite)"/>
    <rect x="300" y="790" width="520" height="2" fill="url(#trailWhite)"/>
    <rect x="1100" y="772" width="560" height="2" fill="url(#trailRed)"/>
  </g>

  <!-- Postes de luz -->
  <use href="#pole" x="240" y="560"/><use href="#pole" x="560" y="575"/>
  <use href="#pole" x="1380" y="575"/><use href="#pole" x="1690" y="560"/>

  <!-- Camiones en la calle -->
  <g transform="translate(70 700) scale(.62)">
    <use href="#truck"/>
    <polygon points="396,104 640,70 640,150" fill="url(#beam)" filter="url(#blur2)"/>
  </g>
  <g transform="translate(1780 712) scale(-.6 .6)">
    <use href="#truck"/>
  </g>

  <!-- Camión principal en primer plano -->
  <g transform="translate(1180 820) scale(1.35)">
    <ellipse cx="200" cy="146" rx="230" ry="12" fill="#000" opacity=".45" filter="url(#blur6)"/>
    <use href="#truck"/>
    <polygon points="396,104 640,60 640,160" fill="url(#beam)" filter="url(#blur2)"/>
  </g>
  <g transform="translate(-120 860) scale(1.25)">
    <ellipse cx="200" cy="146" rx="230" ry="12" fill="#000" opacity=".45" filter="url(#blur6)"/>
    <use href="#truck"/>
    <polygon points="396,104 600,66 600,150" fill="url(#beam)" filter="url(#blur2)"/>
  </g>

  <!-- Bruma del suelo -->
  <rect x="0" y="640" width="1920" height="90" fill="#4f9bff" opacity=".06" filter="url(#blur6)"/>
</svg>
